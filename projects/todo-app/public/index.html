<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO List - 待辦事項</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 我的待辦事項</h1>
      <p class="subtitle">記錄你的日常任務</p>
    </header>

    <main>
      <!-- Input Section -->
      <div class="input-section">
        <form id="todoForm">
          <input 
            type="text" 
            id="todoInput" 
            placeholder="新增待辦事項..." 
            autocomplete="off"
            maxlength="100"
          >
          <button type="submit" class="add-btn">+ 新增</button>
        </form>
      </div>

      <!-- Stats Section -->
      <div class="stats">
        <span>總數：<strong id="totalCount">0</strong></span>
        <span>已完成：<strong id="completedCount">0</strong></span>
        <span>待做：<strong id="pendingCount">0</strong></span>
      </div>

      <!-- Filter Section -->
      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">待做</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>

      <!-- Todos List -->
      <div id="todosList" class="todos-list">
        <!-- Todos will be inserted here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <p>✨ 沒有待辦事項，好好休息吧！</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
